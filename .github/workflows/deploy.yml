name: Deploy M365 Gateway to Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Wrangler secrets file
        shell: bash
        run: |
          cat > .wrangler-secrets.json <<'EOF'
          {
            "DATA_ENCRYPTION_KEY": "${{ secrets.DATA_ENCRYPTION_KEY }}"
          }
          EOF

          chmod 600 .wrangler-secrets.json

      - name: Deploy Worker
        run: npx wrangler deploy --secrets-file .wrangler-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .wrangler-secrets.json
